<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">TranZit bus route overview</title>
  <desc id="mapDesc">Labeled loop of Bus Depot, Tunnel, Diner, Farm, Cornfield pylon, Power Station, Hunter Cabin, and Town.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2420"/>
      <stop offset="100%" stop-color="#0f1412"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="24" y="36" fill="#e8a23a" font-family="Arial, sans-serif" font-size="18" font-weight="700">TRANZIT BUS LOOP</text>
  <text x="24" y="58" fill="#9aaba1" font-family="Arial, sans-serif" font-size="12">Follow the bus clockwise. Fog sections are the side stops.</text>

  <!-- road loop -->
  <path d="M120,140 C180,90 280,80 360,95 C450,115 520,140 580,130 C650,118 700,150 710,210 C720,280 680,330 600,345 C500,365 400,350 320,340 C230,328 150,300 120,240 C100,200 90,170 120,140 Z"
        fill="none" stroke="#45554c" stroke-width="18" stroke-linecap="round"/>
  <path d="M120,140 C180,90 280,80 360,95 C450,115 520,140 580,130 C650,118 700,150 710,210 C720,280 680,330 600,345 C500,365 400,350 320,340 C230,328 150,300 120,240 C100,200 90,170 120,140 Z"
        fill="none" stroke="#4ecdc4" stroke-width="2" stroke-dasharray="8 10" marker-mid="url(#arrow)"/>

  <!-- stops -->
  <g font-family="Arial, sans-serif">
    <circle cx="130" cy="150" r="14" fill="#e8a23a"/><text x="126" y="155" fill="#0f1412" font-size="12" font-weight="700">1</text>
    <text x="150" y="145" fill="#e8efe9" font-size="13" font-weight="700">Bus Depot</text>
    <text x="150" y="162" fill="#9aaba1" font-size="11">Spawn · Turbine</text>

    <circle cx="280" cy="95" r="12" fill="#33403a" stroke="#4ecdc4" stroke-width="2"/><text x="276" y="99" fill="#4ecdc4" font-size="11" font-weight="700">T</text>
    <text x="298" y="92" fill="#e8efe9" font-size="12" font-weight="700">Tunnel</text>
    <text x="298" y="108" fill="#9aaba1" font-size="11">Jet Engine · Board</text>

    <circle cx="430" cy="120" r="14" fill="#e8a23a"/><text x="426" y="125" fill="#0f1412" font-size="12" font-weight="700">2</text>
    <text x="450" y="116" fill="#e8efe9" font-size="13" font-weight="700">Diner</text>
    <text x="450" y="133" fill="#9aaba1" font-size="11">Garage radio · Lamp</text>

    <circle cx="560" cy="145" r="14" fill="#e8a23a"/><text x="556" y="150" fill="#0f1412" font-size="12" font-weight="700">3</text>
    <text x="530" y="175" fill="#e8efe9" font-size="13" font-weight="700">Farm</text>
    <text x="510" y="192" fill="#9aaba1" font-size="11">Fridge power box</text>

    <circle cx="480" cy="250" r="14" fill="#5eb8ff"/><text x="475" y="255" fill="#0f1412" font-size="12" font-weight="700">C</text>
    <text x="500" y="245" fill="#e8efe9" font-size="13" font-weight="700">Cornfield</text>
    <text x="500" y="262" fill="#9aaba1" font-size="11">LEFT: Pylon · RIGHT: Nacht</text>

    <circle cx="620" cy="300" r="14" fill="#e8a23a"/><text x="616" y="305" fill="#0f1412" font-size="12" font-weight="700">4</text>
    <text x="640" y="295" fill="#e8efe9" font-size="13" font-weight="700">Power Station</text>
    <text x="640" y="312" fill="#9aaba1" font-size="11">Hatch ’ lab switch</text>

    <circle cx="480" cy="350" r="12" fill="#33403a" stroke="#4ecdc4" stroke-width="2"/><text x="475" y="354" fill="#4ecdc4" font-size="11" font-weight="700">H</text>
    <text x="360" y="365" fill="#e8efe9" font-size="12" font-weight="700">Hunters Cabin</text>
    <text x="360" y="382" fill="#9aaba1" font-size="11">Pressure Gauge · Bowie</text>

    <circle cx="220" cy="310" r="14" fill="#e8a23a"/><text x="216" y="315" fill="#0f1412" font-size="12" font-weight="700">5</text>
    <text x="90" y="305" fill="#e8efe9" font-size="13" font-weight="700">Town</text>
    <text x="60" y="322" fill="#9aaba1" font-size="11">Bar = Jet Gun bench</text>
  </g>

  <rect x="24" y="380" width="12" height="12" fill="#e8a23a" rx="2"/>
  <text x="42" y="391" fill="#9aaba1" font-size="11" font-family="Arial, sans-serif">Main bus stop</text>
  <rect x="150" y="380" width="12" height="12" fill="#33403a" stroke="#4ecdc4" stroke-width="2" rx="2"/>
  <text x="168" y="391" fill="#9aaba1" font-size="11" font-family="Arial, sans-serif">Fog / side area</text>
  <rect x="290" y="380" width="12" height="12" fill="#5eb8ff" rx="2"/>
  <text x="308" y="391" fill="#9aaba1" font-size="11" font-family="Arial, sans-serif">Easter Egg landmark</text>
</svg>
