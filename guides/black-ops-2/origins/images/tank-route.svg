<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="trT trD">
  <title id="trT">Tank route and the three Lightning Staff jump points</title>
  <desc id="trD">The tank runs between the church and the Tank Station. One staff part is taken on the outbound run and two on the return run.</desc>
  <defs><linearGradient id="trBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2420"/><stop offset="100%" stop-color="#0f1412"/></linearGradient></defs>
  <rect width="820" height="330" fill="url(#trBg)"/>

  <path d="M120 200 C 240 120, 330 250, 430 250 S 640 190, 700 118" fill="none" stroke="#6f8077" stroke-width="16" stroke-linecap="round" stroke-opacity="0.3"/>
  <path d="M120 200 C 240 120, 330 250, 430 250 S 640 190, 700 118" fill="none" stroke="#b184f0" stroke-width="2.5" stroke-dasharray="10 8" stroke-linecap="round"/>

  <g fill="#24302a" stroke="#3c4a43" stroke-width="1.5">
    <rect x="40" y="168" width="120" height="66" rx="10"/>
    <rect x="664" y="86" width="120" height="66" rx="10"/>
  </g>
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" fill="#e8efe9" font-size="14" font-weight="600">
    <text x="100" y="196" text-anchor="middle">Church</text>
    <text x="724" y="114" text-anchor="middle">Tank Station</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" fill="#9aaba1" font-size="11">
    <text x="100" y="214" text-anchor="middle">500 · control panel</text>
    <text x="724" y="132" text-anchor="middle">Gen 2 · ~2 min cooldown</text>
  </g>

  <!-- direction arrows -->
  <g fill="#b184f0" opacity="0.9">
    <path d="M258 152 l14 6 -14 6 z"/>
    <path d="M556 226 l-14 -6 14 -6 z"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#b184f0">
    <text x="228" y="140">OUTBOUND &#8594;</text>
    <text x="536" y="248">&#8592; RETURN</text>
  </g>

  <!-- jump points -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700">
    <g>
      <circle cx="352" cy="252" r="15" fill="#1c2621" stroke="#b184f0" stroke-width="2"/>
      <text x="352" y="257" text-anchor="middle" fill="#b184f0">1</text>
    </g>
    <g>
      <circle cx="470" cy="243" r="15" fill="#1c2621" stroke="#b184f0" stroke-width="2"/>
      <text x="470" y="248" text-anchor="middle" fill="#b184f0">2</text>
    </g>
    <g>
      <circle cx="620" cy="182" r="15" fill="#1c2621" stroke="#b184f0" stroke-width="2"/>
      <text x="620" y="187" text-anchor="middle" fill="#b184f0">3</text>
    </g>
  </g>
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#9aaba1">
    <text x="352" y="292" text-anchor="middle">Outbound &#183; cut-off</text>
    <text x="352" y="307" text-anchor="middle">staircase, RIGHT</text>
    <text x="470" y="200" text-anchor="middle">Return &#183; scaffolding,</text>
    <text x="470" y="215" text-anchor="middle">LEFT &#8594; small hole</text>
    <text x="640" y="222" text-anchor="middle">Return &#183; dirt path, RIGHT</text>
    <text x="640" y="237" text-anchor="middle">&#8594; church upper level</text>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#e8705a">
    <text x="352" y="322" text-anchor="middle">Thor steps here &#8212; watch the lane</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f8077">
    <text x="20" y="26">Two players split points 2 and 3 on one return run.</text>
  </g>
</svg>
