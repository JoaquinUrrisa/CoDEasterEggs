<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="rpT rpD">
  <title id="rpT">The ring puzzle in the lower Excavation Site</title>
  <desc id="rpD">Four floating rings sit above an orb. Four levers, two on the walkway and two on the wooden scaffolding, each rotate one ring. Set all four lights to your element's colour, then shoot the orb with that staff.</desc>
  <defs><linearGradient id="rpBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2420"/><stop offset="100%" stop-color="#0f1412"/></linearGradient></defs>
  <rect width="640" height="400" fill="url(#rpBg)"/>

  <g fill="none" stroke="#45554c">
    <circle cx="320" cy="180" r="132" stroke-width="7"/>
    <circle cx="320" cy="180" r="106" stroke-width="7"/>
    <circle cx="320" cy="180" r="80" stroke-width="7"/>
    <circle cx="320" cy="180" r="54" stroke-width="7"/>
  </g>

  <!-- ring lights -->
  <g>
    <circle cx="320" cy="48" r="9" fill="#e8a23a"/>
    <circle cx="426" cy="180" r="9" fill="#e8a23a"/>
    <circle cx="320" cy="286" r="9" fill="#e8a23a"/>
    <circle cx="240" cy="180" r="9" fill="#e8a23a"/>
  </g>

  <!-- orb -->
  <circle cx="320" cy="180" r="22" fill="#2b3730" stroke="#e8a23a" stroke-width="2"/>
  <circle cx="320" cy="180" r="9" fill="#e8a23a" opacity="0.85"/>
  <text x="320" y="228" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e8a23a">shoot with your staff</text>

  <!-- levers -->
  <g stroke="#9aaba1" stroke-width="3" stroke-linecap="round">
    <path d="M86 116 l18 -20"/><path d="M86 116 v26"/>
    <path d="M554 116 l-18 -20"/><path d="M554 116 v26"/>
    <path d="M86 296 l18 -20"/><path d="M86 296 v26"/>
    <path d="M554 296 l-18 -20"/><path d="M554 296 v26"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#9aaba1" text-anchor="middle">
    <text x="86" y="166">lever</text><text x="86" y="180">walkway</text>
    <text x="554" y="166">lever</text><text x="554" y="180">walkway</text>
    <text x="86" y="346">lever</text><text x="86" y="360">scaffolding</text>
    <text x="554" y="346">lever</text><text x="554" y="360">scaffolding</text>
  </g>

  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" fill="#e8efe9">
    <text x="320" y="26" text-anchor="middle" font-weight="600">All four lights on your colour, then shoot the orb</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#6f8077">
    <text x="20" y="388">Only one element's orb exists at a time &#8212; queue up, one player at a time.</text>
  </g>
</svg>
