<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" role="img" aria-labelledby="mapT mapD">
  <title id="mapT">Origins dig site overview</title>
  <desc id="mapD">Schematic of Origins. The Excavation Site sits in the centre. The church and Generator 6 are west, Generators 5 and 4 are north and south of the mound in No Man's Land, and the Workshop, Tank Station and Spawn are east. The four elemental tunnels and the tank route are marked, with three dashed vertical lines for the giant robot walking lanes.</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2420"/><stop offset="100%" stop-color="#0f1412"/>
    </linearGradient>
    <radialGradient id="moundGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8a23a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e8a23a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="530" fill="url(#mapBg)"/>

  <!-- robot lanes sit behind everything -->
  <g stroke-dasharray="5 9" stroke-width="2" fill="none" opacity="0.32">
    <path d="M150 34 V 496" stroke="#5eb8ff"/>
    <path d="M440 34 V 496" stroke="#e8c33a"/>
    <path d="M728 34 V 496" stroke="#b184f0"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="0.12em">
    <text x="150" y="26" text-anchor="middle" fill="#5eb8ff">FREYA</text>
    <text x="440" y="26" text-anchor="middle" fill="#e8c33a">ODIN</text>
    <text x="728" y="26" text-anchor="middle" fill="#b184f0">THOR</text>
  </g>

  <!-- tank route -->
  <path d="M250 272 C 330 348, 380 356, 448 350 S 616 258, 676 154"
        fill="none" stroke="#6f8077" stroke-width="11" stroke-linecap="round" stroke-opacity="0.3"/>
  <path d="M250 272 C 330 348, 380 356, 448 350 S 616 258, 676 154"
        fill="none" stroke="#9aaba1" stroke-width="2" stroke-dasharray="9 7" stroke-linecap="round"/>
  <text x="392" y="386" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif"
        font-size="12" font-style="italic" fill="#9aaba1">tank route (muddy)</text>

  <!-- mound -->
  <circle cx="440" cy="262" r="98" fill="url(#moundGlow)"/>
  <circle cx="440" cy="262" r="66" fill="#2b3730" stroke="#e8a23a" stroke-width="2"/>
  <circle cx="440" cy="262" r="46" fill="#1c2621" stroke="#45554c" stroke-width="1.5"/>
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" text-anchor="middle">
    <text x="440" y="252" font-size="13" font-weight="600" fill="#e8a23a">EXCAVATION</text>
    <text x="440" y="269" font-size="13" font-weight="600" fill="#e8a23a">SITE</text>
    <text x="440" y="290" font-size="10.5" fill="#9aaba1" font-family="IBM Plex Mono, monospace">Pack-a-Punch</text>
  </g>

  <!-- zones -->
  <g fill="#24302a" stroke="#3c4a43" stroke-width="1.5">
    <rect x="70" y="226" width="180" height="80" rx="10"/>
    <rect x="352" y="44" width="200" height="76" rx="10"/>
    <rect x="352" y="404" width="200" height="76" rx="10"/>
    <rect x="676" y="96" width="180" height="80" rx="10"/>
    <rect x="640" y="232" width="170" height="70" rx="10"/>
    <rect x="676" y="380" width="180" height="92" rx="10"/>
  </g>

  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e8efe9" text-anchor="middle">
    <text x="160" y="258">Church</text>
    <text x="452" y="74">No Man's Land N</text>
    <text x="452" y="434">No Man's Land S</text>
    <text x="766" y="128">Tank Station</text>
    <text x="725" y="260">Workshop</text>
    <text x="766" y="410">Spawn</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#9aaba1" text-anchor="middle">
    <text x="160" y="280">tank starts here</text>
    <text x="452" y="96">Stamin-Up &#183; the seal</text>
    <text x="452" y="456">Juggernog</text>
    <text x="766" y="150">blue record &#183; tablets</text>
    <text x="725" y="282">No Man's Land door</text>
    <text x="766" y="432">shovels &#183; drone brain</text>
    <text x="766" y="450">Rituals box</text>
  </g>

  <!-- generator badges, clear of the boxes -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g><circle cx="46" cy="266" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="46" y="271" fill="#e8a23a">6</text></g>
    <g><circle cx="328" cy="82" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="328" y="87" fill="#e8a23a">5</text></g>
    <g><circle cx="328" cy="442" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="328" y="447" fill="#e8a23a">4</text></g>
    <g><circle cx="652" cy="136" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="652" y="141" fill="#e8a23a">2</text></g>
    <g><circle cx="616" cy="267" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="616" y="272" fill="#e8a23a">3</text></g>
    <g><circle cx="652" cy="426" r="15" fill="#1c2621" stroke="#e8a23a" stroke-width="2"/><text x="652" y="431" fill="#e8a23a">1</text></g>
  </g>

  <!-- elemental tunnels -->
  <g font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <g><rect x="112" y="322" width="96" height="26" rx="6" fill="#141b18" stroke="#5eb8ff" stroke-width="1.5"/><text x="160" y="339" fill="#5eb8ff">ICE TUNNEL</text></g>
    <g><rect x="574" y="60" width="128" height="26" rx="6" fill="#141b18" stroke="#b184f0" stroke-width="1.5"/><text x="638" y="77" fill="#b184f0">LIGHTNING TUNNEL</text></g>
    <g><rect x="556" y="476" width="118" height="26" rx="6" fill="#141b18" stroke="#e8c33a" stroke-width="1.5"/><text x="615" y="493" fill="#e8c33a">WIND TUNNEL</text></g>
    <g><rect x="676" y="318" width="104" height="26" rx="6" fill="#141b18" stroke="#e8705a" stroke-width="1.5"/><text x="728" y="335" fill="#e8705a">FIRE TUNNEL</text></g>
  </g>

  <text x="24" y="512" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f8077">Schematic, not to scale &#183; dashed vertical lines are the three robot walking lanes</text>
</svg>
